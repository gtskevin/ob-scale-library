<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg { fill: #1a1610; }
        .title { fill: #f5ede0; }
        .sub { fill: #c9a96e; }
        .pill-bg { fill: #2a2318; }
        .pill-text { fill: #c9a96e; }
        .accent { fill: #c9a96e; }
      }
    </style>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a96e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0855a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect class="bg" width="800" height="200" rx="16" fill="#f8f5ef"/>
  <!-- Accent line top -->
  <rect x="0" y="0" width="800" height="4" fill="url(#accent)" rx="0"/>
  <!-- Search icon -->
  <circle cx="310" cy="85" r="14" fill="none" stroke="#c9a96e" stroke-width="3"/>
  <line x1="320" y1="95" x2="330" y2="105" stroke="#c9a96e" stroke-width="3" stroke-linecap="round"/>
  <!-- Title -->
  <text x="400" y="82" text-anchor="middle" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="36" font-weight="bold" class="title" fill="#1a1610">
    OB量表检索库
  </text>
  <text x="400" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" class="sub" fill="#8a7a5a">
    OB/HRM Measurement Scale Search Library
  </text>
  <!-- Pills -->
  <rect x="270" y="132" width="80" height="24" rx="12" class="pill-bg" fill="#ede7d9"/>
  <text x="310" y="149" text-anchor="middle" font-family="monospace" font-size="11" class="pill-text" fill="#8a7a5a">900+ 量表</text>
  <rect x="360" y="132" width="100" height="24" rx="12" class="pill-bg" fill="#ede7d9"/>
  <text x="410" y="149" text-anchor="middle" font-family="monospace" font-size="11" class="pill-text" fill="#8a7a5a">GitHub Pages</text>
  <rect x="470" y="132" width="80" height="24" rx="12" class="pill-bg" fill="#ede7d9"/>
  <text x="510" y="149" text-anchor="middle" font-family="monospace" font-size="11" class="pill-text" fill="#8a7a5a">离线可用</text>
</svg>
