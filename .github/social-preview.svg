<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .bg { fill: #1a1610; }
        .card { fill: #2a2318; }
        .title { fill: #f5ede0; }
        .sub { fill: #c9a96e; }
        .body { fill: #b8a888; }
        .pill { fill: #332b1f; }
        .pill-t { fill: #c9a96e; }
      }
    </style>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a96e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0855a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect class="bg" width="1200" height="630" fill="#f8f5ef"/>
  <!-- Gold accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#gold)"/>
  <!-- Left visual: search mockup -->
  <rect x="60" y="80" width="420" height="470" rx="20" class="card" fill="#ede7d9"/>
  <!-- Search bar mock -->
  <rect x="90" y="110" width="360" height="44" rx="12" fill="#f8f5ef"/>
  <text x="120" y="138" font-family="'PingFang SC',system-ui,sans-serif" font-size="14" fill="#b8a888">🔍 搜索量表名、变量、作者...</text>
  <!-- List items mock -->
  <rect x="90" y="170" width="360" height="50" rx="10" fill="#f8f5ef" opacity="0.7"/>
  <rect x="90" y="230" width="360" height="50" rx="10" fill="#f8f5ef" opacity="0.7"/>
  <rect x="90" y="290" width="360" height="50" rx="10" fill="#f8f5ef" opacity="0.7"/>
  <rect x="90" y="350" width="360" height="50" rx="10" fill="#f8f5ef" opacity="0.5"/>
  <!-- Gold dots on items -->
  <circle cx="110" cy="195" r="5" fill="#c9a96e"/>
  <circle cx="110" cy="255" r="5" fill="#c9a96e"/>
  <circle cx="110" cy="315" r="5" fill="#c9a96e"/>
  <!-- Right content -->
  <text x="560" y="160" font-family="'PingFang SC','Noto Sans SC',system-ui,sans-serif" font-size="52" font-weight="bold" class="title" fill="#1a1610">OB量表检索库</text>
  <text x="560" y="210" font-family="system-ui,sans-serif" font-size="20" class="sub" fill="#8a7a5a">OB/HRM Measurement Scale Search Library</text>
  <text x="560" y="270" font-family="'PingFang SC',system-ui,sans-serif" font-size="17" class="body" fill="#6b6050">
    <tspan x="560" dy="0">一站式检索组织行为学与人力资源管理量表</tspan>
    <tspan x="560" dy="28">900+ 量表 · 关键词搜索 · 目录浏览 · 引用复制</tspan>
    <tspan x="560" dy="28">单文件离线版 · GitHub Pages 免费托管</tspan>
  </text>
  <!-- Pills -->
  <rect x="560" y="370" width="110" height="32" rx="16" class="pill" fill="#ede7d9"/>
  <text x="615" y="391" text-anchor="middle" font-family="monospace" font-size="13" class="pill-t" fill="#8a7a5a">900+ 量表</text>
  <rect x="685" y="370" width="120" height="32" rx="16" class="pill" fill="#ede7d9"/>
  <text x="745" y="391" text-anchor="middle" font-family="monospace" font-size="13" class="pill-t" fill="#8a7a5a">离线可用</text>
  <rect x="820" y="370" width="130" height="32" rx="16" class="pill" fill="#ede7d9"/>
  <text x="885" y="391" text-anchor="middle" font-family="monospace" font-size="13" class="pill-t" fill="#8a7a5a">GitHub Pages</text>
  <!-- URL -->
  <text x="560" y="470" font-family="monospace" font-size="14" fill="#b8a888">gtskevin.github.io/ob-scale-library</text>
</svg>
